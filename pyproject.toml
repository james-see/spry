[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spry"
version = "0.5.9"
description = "social media scanner"
readme = "README.rst"
requires-python = ">=3.12"
license = "GPL-3.0"
authors = [{ name = "James A. Campbell", email = "james@jamescampbell.us" }]
maintainers = [{ name = "James A. Campbell", email = "james@jamescampbell.us" }]
keywords = ["social", "collector", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "beautifulsoup4",
    "clint",
    "fpdf",
    "pysocks",
    "requests",
    "termcolor",
    "weasyprint",
]

[project.urls]
Homepage = "https://github.com/jamesacampbell/spry"
Repository = "https://github.com/jamesacampbell/spry"
Documentation = "http://spry.rtfd.io"

[project.scripts]
spry = "spry.spry:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["spry", "spry.modules"]

[tool.coverage.run]
branch = true
source = ["spry"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = [
    "E501",
    "F403",
    "F405",
    "E402",
    "SIM108",
    "SIM113",
    "SIM114",
    "SIM115",
    "SIM222",
    "E731",
    "N806",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
